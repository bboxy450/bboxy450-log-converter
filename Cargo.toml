[package]
name = "bboxy450-log-converter"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Boxy <bboxy450@gmail.com>"]
description = "Common IR and cross-harness conversion for Claude Code, Codex and Bboxy logs"
repository = "https://github.com/bboxy450/bboxy450-log-converter"
license-file = "LICENSE"

[features]
default = []

[dependencies]
blake3 = "1"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", features = ["serde"] }

[dev-dependencies]
bboxy450-tlc = "=0.1.1"
